openapi: 3.0.3
info:
  title: Secure Auth & JWT Integration API
  description: API for authentication and JWT-based authorization
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Development server

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      description: Creates a new user account and returns JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  format: password
                  description: User's password (min 8 characters)
                name:
                  type: string
                  description: User's display name (optional)
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                    description: JWT access token
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Bad request - Validation error
        '409':
          description: Conflict - Email already exists

  /api/auth/login:
    post:
      summary: Login user
      description: Authenticates user and returns JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                    description: JWT access token
        '400':
          description: Bad request - Invalid input
        '401':
          description: Unauthorized - Invalid credentials

  /api/auth/me:
    get:
      summary: Get current user
      description: Returns information about the currently authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized - Invalid or missing token

  /api/tasks:
    get:
      summary: Get current user's tasks
      description: Retrieve all tasks belonging to the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of user's tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing token
    post:
      summary: Create new task
      description: Create a new task for the authenticated user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request - Validation error
        '401':
          description: Unauthorized - Invalid or missing token

  /api/tasks/{task_id}:
    get:
      summary: Get specific task
      description: Retrieve a specific task if it belongs to the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the task
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - User doesn't own this task
        '404':
          description: Task not found
    put:
      summary: Update task
      description: Update a specific task if it belongs to the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Bad request - Validation error
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - User doesn't own this task
        '404':
          description: Task not found
    delete:
      summary: Delete task
      description: Delete a specific task if it belongs to the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the task
      responses:
        '204':
          description: Task deleted successfully
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - User doesn't own this task
        '404':
          description: Task not found

  /api/tasks/{task_id}/toggle:
    patch:
      summary: Toggle task completion
      description: Toggle the completion status of a specific task if it belongs to the authenticated user
      security:
        - BearerAuth: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the task
      responses:
        '200':
          description: Task completion status toggled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized - Invalid or missing token
        '403':
          description: Forbidden - User doesn't own this task
        '404':
          description: Task not found

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required:
        - id
        - email
      properties:
        id:
          type: string
          description: Unique identifier for the user
          example: "user-uuid-here"
        email:
          type: string
          format: email
          description: User's email address
          example: "user@example.com"
        name:
          type: string
          description: User's display name
          example: "John Doe"
        emailVerified:
          type: boolean
          description: Whether the email has been verified
          example: true
        createdAt:
          type: string
          format: date-time
          description: When the account was created
          example: "2026-01-14T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          description: When the account was last updated
          example: "2026-01-14T10:00:00Z"

    Task:
      type: object
      required:
        - id
        - title
        - user_id
        - completed
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier of the task
          example: "task-uuid-here"
        title:
          type: string
          description: Title of the task (1-200 characters)
          example: "Complete project documentation"
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Optional description of the task
          example: "Finish writing the API documentation"
        completed:
          type: boolean
          description: Whether the task is completed
          example: false
        user_id:
          type: string
          description: ID of the user who owns this task
          example: "user-uuid-here"
        version:
          type: integer
          description: Version number for optimistic locking
          example: 1
        created_at:
          type: string
          format: date-time
          description: Timestamp when the task was created
          example: "2026-01-14T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the task was last updated
          example: "2026-01-14T10:00:00Z"

    TaskCreate:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Title of the task (1-200 characters)
          example: "Complete project documentation"
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Optional description of the task
          example: "Finish writing the API documentation"

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the task (1-200 characters)
          example: "Complete project documentation"
          minLength: 1
          maxLength: 200
        description:
          type: string
          description: Updated description of the task
          example: "Finish writing the API documentation"
        completed:
          type: boolean
          description: Updated completion status
          example: true