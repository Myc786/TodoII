openapi: 3.0.0
info:
  title: Chat API for Todo Application
  version: 1.0.0
  description: API contracts for chatbot functionality in the Todo application

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.todoapp.com
    description: Production server

paths:
  /api/chat/messages:
    post:
      summary: Send a message to the chatbot
      description: Sends a user message to the AI chatbot and receives a response
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  description: The user's message to the chatbot
                  example: "Add a new task called 'Buy groceries'"
                userId:
                  type: string
                  description: The ID of the authenticated user
                  example: "user-12345"
      responses:
        '200':
          description: Successful response from the chatbot
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - action
                properties:
                  success:
                    type: boolean
                    description: Whether the request was successful
                    example: true
                  message:
                    type: string
                    description: The chatbot's response message
                    example: "I've added the task 'Buy groceries' to your list."
                  action:
                    type: string
                    description: The action taken by the chatbot
                    enum: [task_created, task_updated, task_deleted, info_only]
                  taskId:
                    type: string
                    description: ID of the task affected by the action (if applicable)
                    example: "task-67890"
        '400':
          description: Bad request - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/chat/conversation/start:
    post:
      summary: Start a new chat conversation
      description: Initializes a new chat session for the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New conversation started successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - conversationId
                properties:
                  success:
                    type: boolean
                    example: true
                  conversationId:
                    type: string
                    description: Unique identifier for the conversation
                    example: "conv-abc123"
        '401':
          description: Unauthorized - invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
          example: "Invalid authentication token"
        errorCode:
          type: string
          description: Specific error code
          example: "AUTH_001"