openapi: 3.0.0
info:
  title: Todo Chatbot MCP Tools
  description: MCP tools for the AI-powered Todo Chatbot Extension
  version: 1.0.0

paths: {}

components:
  schemas:
    # Common Response Schema
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the operation was successful
        data:
          type: object
          description: The response data payload
        error:
          type: string
          description: Error message if operation failed
      required:
        - success

    # Task Schema (matches existing backend)
    Task:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the task
        title:
          type: string
          description: Title of the task
        description:
          type: string
          description: Optional description of the task
        completed:
          type: boolean
          description: Whether the task is completed
        created_at:
          type: string
          format: date-time
          description: When the task was created
        updated_at:
          type: string
          format: date-time
          description: When the task was last updated
        version:
          type: integer
          description: Version number for optimistic locking
      required:
        - id
        - title
        - completed
        - created_at
        - updated_at
        - version

    # MCP Tool Schemas
    CreateTaskRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the task to create
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: Optional description of the task
          maxLength: 1000
      required:
        - title

    CreateTaskResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Task'
        error:
          type: string

    ListTasksRequest:
      type: object
      properties:
        filter:
          type: string
          enum: [all, active, completed]
          description: Filter for task status
          default: all

    ListTasksResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        error:
          type: string

    UpdateTaskRequest:
      type: object
      properties:
        taskId:
          type: string
          description: ID of the task to update
        title:
          type: string
          description: New title for the task
          minLength: 1
          maxLength: 255
        description:
          type: string
          description: New description for the task
          maxLength: 1000

    UpdateTaskResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Task'
        error:
          type: string

    CompleteTaskRequest:
      type: object
      properties:
        taskId:
          type: string
          description: ID of the task to mark as complete
        completed:
          type: boolean
          description: Whether to mark as complete or incomplete
          default: true
        version:
          type: integer
          description: Current version for optimistic locking

    CompleteTaskResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Task'
        error:
          type: string

    DeleteTaskRequest:
      type: object
      properties:
        taskId:
          type: string
          description: ID of the task to delete

    DeleteTaskResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          description: Empty object on success
        error:
          type: string

    # Chatbot Interaction Schemas
    ChatMessage:
      type: object
      properties:
        content:
          type: string
          description: The message content from the user
          minLength: 1
        userId:
          type: string
          description: The authenticated user ID
        sessionId:
          type: string
          description: The chat session ID

    ChatResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            response:
              type: string
              description: The AI-generated response
            actionTaken:
              type: string
              description: Description of action taken
            taskInfo:
              $ref: '#/components/schemas/Task'
              description: Relevant task information if applicable
        error:
          type: string